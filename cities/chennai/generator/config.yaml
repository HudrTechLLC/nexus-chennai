# Synthetic Chennai generator settings (spec D2). Everything city-specific lives here.
id_prefix: CHN
utc_offset: "+05:30"          # IST has no DST, so a fixed offset is exact
end_date: "2026-10-25"         # the run is pinned: no wall-clock time anywhere
months: 24
total_firs: 14000              # D1 #1
fir_numbers_per_year: 1500     # station registers also hold non-focus FIRs, so numbers have gaps
station_short_codes:           # CHN-<short>-<year>-<fir>; others are derived from the name, unique
  J2: AD                       # spec examples: CHN-AD-2026-001182 (Adyar)
  J7: VL                       #                CHN-VL-2026-000877 (Velachery)

# Background crime mix (shares sum to 1). anchors = POI types to place near (weights);
# "residential" = a random point inside a ward. hours = [start, end, weight] bands (local time).
