# Building blocks for the generated series (30 - named). Each picks one crime type and one
# distinctive signature, so members are alike and unlike everything else.
generated:
  crime_types: [chain_snatching, mobile_snatching, night_house_break, day_house_break, two_wheeler_theft,
                street_robbery, pickpocket, shop_theft, cheating]
  size: [3, 12]
  stations: [2, 5]
  step_km: [1.0, 3.5]
  step_days: [2, 25]
  signatures:
    vehicle_colours: [black, blue, grey, white, maroon, green, yellow, silver]
    motorcycles: [Honda Shine, TVS Apache, Hero Splendor, Yamaha FZ, Royal Enfield Classic, Suzuki Access, Honda Activa]
    helmets: [white full-face, blue open-face, red, grey with sticker, no helmet, yellow]
    approaches:
      chain_snatching: [two_wheeler_from_behind, asked_for_directions, posed_as_courier]
      mobile_snatching: [two_wheeler_from_behind, on_foot_snatch_and_run, auto_pillion]
      night_house_break: [door_lock_broken, back_door_pried, roof_sheet_removed]
      day_house_break: [posed_as_eb_staff, posed_as_gas_delivery, duplicate_key]
      two_wheeler_theft: [handle_lock_broken, wire_bypass, duplicate_key]
      street_robbery: [knife_threat_two_men, auto_lure, fake_police_check]
      pickpocket: [crowd_jostle, bus_door_press, distraction_by_spill]
      shop_theft: [distraction_pair, fake_bill_swap, trial_room_switch]
      cheating: [atm_card_swap, fake_kyc_call, gold_loan_fraud]
    distinctive: [scar on left cheek, wears a saffron thread on wrist, speaks Telugu, red cap,
                  limps slightly, tattoo of an anchor on forearm, wears spectacles, sports shoes with neon laces,
                  carries a black backpack, has a bandage on right hand]
