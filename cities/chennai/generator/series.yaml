# Planted structure (spec D2 "Planted structure"). Ground truth goes to _truth/, never read at runtime.
counts:
  series: 30          # named below + generated
  decoys: 25
  duplicates: 15

# Named demo series. `stations` are codes; members walk between them, each member within
# `step_km` and `step_days` of the previous so every member passes q_candidates blocking.
named:
  - series_id: SER-RED-PULSAR
    name: Red Pulsar Duo
    crime_type: chain_snatching
    stations: [J2, J7, J6, J3, J5]
    size: 9
    hours: [19.0, 21.5]
    step_km: [1.5, 3.5]
    step_days: [2, 9]
    anchors: {bus_stop: 1}
    mo:
      approach: two_wheeler_from_behind
      offender_count: 2
      target: lone_pedestrian_woman
      target_item: gold_chain
      escape: two_wheeler_towards_main_road
      violence: push
      place_type: [bus_stop, main_road]
      disguise: [helmet]
    vehicle: {type: motorcycle, make_model: Bajaj Pulsar 150, colour: red, plate: "TN 09 BX 4471",
              witnessed: ["TN 09 ?? 4471", "TN 09 B? 4471", "?? 4471", null]}
    offenders: {count: 2, helmet: black with red stripe, build: thin, age_band: "20-30"}
    victim: {gender: F, age_band: ["40-50", "50-60"]}
    # The spec's own example pair (D3.1, D3.4, D3.8, D3.9, D3.11), planted verbatim as input data.
    hero:
