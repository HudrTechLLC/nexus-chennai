# Local stack. Zetaris and Nightshift run outside compose (their own installers).
# `docker compose up` starts the API (:8000) and the web app (:3001); add `--profile worker` for the worker.
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      METERLESS_BASE_URL: ${METERLESS_BASE_URL:-http://host.docker.internal:8088/v1}
      ZETARIS_REST_URL: ${ZETARIS_REST_URL:-http://host.docker.internal:8888/api/v1.0}
    ports: ["8000:8000"]
    volumes: ["./logs:/repo/logs"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  worker:
    build: { context: ., dockerfile: Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      METERLESS_BASE_URL: ${METERLESS_BASE_URL:-http://host.docker.internal:8088/v1}
      ZETARIS_REST_URL: ${ZETARIS_REST_URL:-http://host.docker.internal:8888/api/v1.0}
    command: ["python", "-m", "app.worker"]
    # Shares logs/ with the api so H-MEM state (logs/hmem) and traces are one store.
    volumes: ["./logs:/repo/logs"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    profiles: ["worker"]
  web:
    # Same Next.js app as the Vercel deployment (D-003). Public values are baked in at build time
    # from the root .env; the anon key is public by design (RLS guards the data).
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
        CITY: ${CITY:-chennai}
    # No env_file: the web app reads only NEXT_PUBLIC_* values (baked in above), and the root .env also
    # holds server secrets (service-role key, Zetaris, Meterless) that must never reach the web container.
    ports: ["3001:3001"]
