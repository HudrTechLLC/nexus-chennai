name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/api/requirements-dev.txt }
      - run: pip install -r services/api/requirements-dev.txt
      - run: ruff check services tests scripts run.py
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secret files tracked
        run: "! git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'"
      - name: No secret values in tracked files
        run: "! git grep -nE '(nvapi-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{10,}|eyJhbGciOi[A-Za-z0-9_-]{30,}|BEGIN [A-Z ]*PRIVATE KEY)' -- . ':!engg/docs/SPEC.md'"
