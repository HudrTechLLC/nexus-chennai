name: docker-web-image

# NFR-03: proves `docker compose up` can serve the web app (D-003). Builds Dockerfile.web from the
# repo root, starts it with an empty environment and checks pages answer. Not a required check.
# Kept out of docker.yml so the judge-path job's triggers stay exactly as they are.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile.web
      - Dockerfile.web.dockerignore
      - docker-compose.yml
      - output_examples/**
      - .github/workflows/docker-web.yml

jobs:
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: docker compose config --quiet
      - name: docker build (repo root context)
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile.web -t nexus-web .
      - name: start and check pages
        run: |
          docker run -d --name web -p 3001:3001 nexus-web
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3001/about/privacy && break; sleep 2; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/about/privacy)
          echo "/about/privacy -> $code"; [ "$code" = 200 ] || { docker logs web | tail -50; exit 1; }
          # Pages that need Supabase cannot load data with no env; record their status, don't fail on it.
          for p in / /console/login; do echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001$p)"; done
      - if: always()
        run: docker logs web 2>&1 | tail -40 || true
